name: argocd_flutter
description: Flutter app shell for ArgoCD.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0
  native_dio_adapter: ^1.4.0
  shared_preferences: ^2.5.3
  sentry_flutter: ^9.14.0
  sentry_dio: ^9.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  golden_toolkit: ^0.15.0
  sentry_dart_plugin: ^2.3.0

flutter:
  uses-material-design: true
  fonts:
    # Inter / Inter Display (SIL OFL 1.1, see assets/fonts/Inter-LICENSE.txt)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
    # JetBrains Mono (SIL OFL 1.1, see assets/fonts/JetBrainsMono-LICENSE.txt)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
