org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false

# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon
# JVM. In CI the Kotlin daemon intermittently died on startup ("daemon has
# terminated unexpectedly ... No such file or directory"), failing
# :compileKotlin in Flutter's included flutter_tools build. Root
# gradle.properties also applies to included builds.
kotlin.compiler.execution.strategy=in-process
